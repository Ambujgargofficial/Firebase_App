<style>
:root { --navy-primary: #001f3f; --navy-dark: #001529; --navy-light: #003366; --navy-accent: #0074D9; --navy-hover: #002a52; --success: #34a853; --warning: #fbbc04; --danger: #ea4335; }

.sidebar-brand-logo { width: 36px; height: 36px; object-fit: contain; flex-shrink: 0; }
.sidebar-brand-name { font-size: 17px; font-weight: 700; color: #fff; white-space: nowrap; }
.sidebar-user-info { padding: 24px 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }

/* Searchable Dropdown */

.searchable-dropdown-item { padding: 12px 16px; cursor: pointer; font-size: 15px; transition: background 0.2s; border-bottom: 1px solid #f0f0f0; }
.searchable-dropdown-item:hover { background: rgba(0,116,217,0.1); }
.searchable-dropdown-item.selected { background: var(--navy-primary); color: white; }

.close-btn { background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; transition: transform 0.3s; }

/* Badges & Chips */

.badge-red { background: #f8d7da; color: #721c24; }

/* Dashboard Cards (AdminLTE Style) */
.small-box { border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; display: block; overflow: hidden; color: white; margin-bottom: 20px; transition: transform 0.3s; }

.small-box h3 { font-size: 32px; font-weight: 700; margin: 0 0 10px 0; }

.bg-navy { background: linear-gradient(135deg, var(--navy-primary), var(--navy-light)); }
.bg-success { background: linear-gradient(135deg, #2e8b46, #34a853); }
.bg-danger { background: linear-gradient(135deg, #c5221f, #ea4335); }
.bg-info { background: linear-gradient(135deg, #005f99, #0074D9); }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }

/* Navbar */
.navbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
.nav-title { font-size: 20px; font-weight: 700; color: var(--navy-primary); display: flex; align-items: center; gap: 10px; }
.nav-actions { display: flex; align-items: center; gap: 15px; }
.nav-btn { background: #f0f2f5; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 16px; color: #555; cursor: pointer; transition: all 0.2s; }
.nav-btn:hover { background: var(--navy-primary); color: white; }

/* Radio Toggles for Debit/Credit */
.radio-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
.radio-toggle label { flex: 1; text-align: center; background: #f8f9fa; border: 2px solid #dee2e6; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 700; transition: all 0.2s; font-size: 15px; }
.radio-toggle input[type="radio"] { display: none; }
.radio-toggle input[type="radio"]:checked + label.gave-btn { background: #dc3545; color: white; border-color: #dc3545; }
.radio-toggle input[type="radio"]:checked + label.got-btn { background: #28a745; color: white; border-color: #28a745; }

/* Top loader */
.top-load { position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 10001; background: rgba(0,116,217,0.2); overflow: hidden; }
.top-load-bar { position: absolute; top: 0; left: 0; height: 100%; width: 40%; background: var(--navy-accent); animation: slide 1s ease-in-out infinite; }
@keyframes slide { 0% { left: -40%; width: 40%; } 50% { left: 30%; width: 50%; } 100% { left: 100%; width: 40%; } }

@media (max-width: 768px) {
    .sidebar { position: fixed; z-index: 999; transform: translateX(-100%); }

    .radio-toggle { flex-direction: column; }
}

.statement-header { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #dee2e6; }

.statement-header .bal { font-size: 20px; font-weight: 700; }

<body>
<div id="root"></div>

<script>
// ==========================================
// FIREBASE CONFIGURATION - PUT YOUR URL HERE
// ==========================================
const DB_URL = 'https://ledgerapp-237c1-default-rtdb.firebaseio.com/'; 

let USE_FIREBASE = false;
let db = null;

if (DB_URL && DB_URL.trim().length > 0) {
    USE_FIREBASE = true;
    firebase.initializeApp({ databaseURL: DB_URL });
    db = firebase.database();
    console.log("Connected to Firebase RTDB.");
    
    // Check and auto-seed the admin user if the database is completely empty.
    // This allows you to log in for the very first time!
    db.ref('users').once('value').then(snap => {
        if (!snap.exists()) {
            db.ref('users').push({
                email: 'admin@demo.com',
                password: 'admin',
                name: 'System Admin',
                role: 'Admin',
                createdAt: new Date().toISOString()
            });
            console.log("Seeded initial Admin user to Firebase.");
        }
    }).catch(err => {
        console.error("Firebase Read Error! Make sure your Firebase Realtime Database RULES are set to true for testing.", err);
    });
} else {
    console.log("No Firebase URL provided. Running in Preview (In-Memory) Mode.");
}

// --- In-Memory Fallback Data ---
const localData = {
    users: {
        u1: { email: 'admin@demo.com', password: 'admin', name: 'System Admin', role: 'Admin' },
        u2: { email: 'user@demo.com', password: 'user', name: 'Standard User', role: 'User' }
    },
    partyTypes: {
        pt1: { name: 'Customer', createdAt: new Date().toISOString() },
        pt2: { name: 'Supplier', createdAt: new Date().toISOString() },
        pt3: { name: 'Partner', createdAt: new Date().toISOString() },
        pt4: { name: 'Employee', createdAt: new Date().toISOString() }
    },
    categories: {
        c1: { name: 'Default', createdAt: new Date().toISOString() },
        c2: { name: 'Office Expense', createdAt: new Date().toISOString() },
        c3: { name: 'Salary', createdAt: new Date().toISOString() }
    },
    parties: {
        p1: { name: 'Rahul Sharma', type: 'Customer', phone: '9876543210', openingBalance: 0, createdAt: new Date().toISOString() },
        p2: { name: 'Super Traders', type: 'Supplier', phone: '1122334455', openingBalance: 5000, createdAt: new Date().toISOString() },
        p3: { name: 'Aman (Partner)', type: 'Partner', phone: '9988776655', openingBalance: -2000, createdAt: new Date().toISOString() }
    },
    transactions: {
        t1: { partyId: 'p1', date: new Date().toISOString(), type: 'gave', amount: 1500, mode: 'Cash', notes: 'Sold goods on credit', createdAt: new Date().toISOString() },
        t2: { partyId: 'p1', date: new Date().toISOString(), type: 'got', amount: 500, mode: 'UPI', notes: 'Part payment', createdAt: new Date().toISOString() },
        t3: { partyId: 'p2', date: new Date().toISOString(), type: 'got', amount: 5000, mode: 'Bank', notes: 'Stock received', createdAt: new Date().toISOString() },
        t4: { partyId: 'p3', date: new Date().toISOString(), type: 'gave', amount: 2000, mode: 'Cash', notes: 'Partner withdrawal', createdAt: new Date().toISOString() }
    }
};

function generateId() { return Math.random().toString(36).substr(2, 9); }

// --- Abstracted API Layer ---
// This safely uses Firebase if configured, otherwise falls back to local JSON data.

async function apiLogin(email, password) {
    if (USE_FIREBASE) {
        try {
            const snap = await db.ref('users').orderByChild('email').equalTo(email).once('value');
            const val = snap.val();
            if (!val) return { success: false, message: 'Invalid credentials' };
            const id = Object.keys(val)[0];
            const user = val[id];
            if (user.password !== password) return { success: false, message: 'Invalid credentials' };
            return { success: true, data: { id, ...user } };
        } catch (e) { return { success: false, message: e.message }; }
    } else {
        const userEntry = Object.entries(localData.users).find(([_, u]) => u.email === email);
        if (userEntry && userEntry[1].password === password) {
            return { success: true, data: { id: userEntry[0], ...userEntry[1] } };
        }
        return { success: false, message: 'Invalid credentials (Use admin@demo.com / admin)' };
    }
}

async function apiGetParties() {
    if (USE_FIREBASE) {
        const snap = await db.ref('parties').once('value');
        const val = snap.val() || {};
        return { success: true, data: Object.entries(val).map(([id, data]) => ({ id, ...data })) };
    } else {
        return { success: true, data: Object.entries(localData.parties).map(([id, data]) => ({ id, ...data })) };
    }
}

async function apiAddParty(data) {
    const payload = { ...data, createdAt: new Date().toISOString() };
    if (USE_FIREBASE) {
        const ref = await db.ref('parties').push(payload);
        return { success: true, id: ref.key };
    } else {
        const id = generateId();
        localData.parties[id] = payload;
        return { success: true, id };
    }
}

async function apiUpdateParty(id, data) {
    if (USE_FIREBASE) {
        await db.ref(`parties/${id}`).update(data);
        return { success: true };
    } else {
        localData.parties[id] = { ...localData.parties[id], ...data };
        return { success: true };
    }
}

async function apiDeleteParty(id) {
    if (USE_FIREBASE) {
        await db.ref(`parties/${id}`).remove();
        // optionally delete transactions related to this party too
        return { success: true };
    } else {
        delete localData.parties[id];
        return { success: true };
    }
}

async function apiGetPartyTypes() {
    if (USE_FIREBASE) {
        const snap = await db.ref('partyTypes').once('value');
        const val = snap.val() || {};
        return { success: true, data: Object.entries(val).map(([id, data]) => ({ id, ...data })) };
    } else {
        return { success: true, data: Object.entries(localData.partyTypes).map(([id, data]) => ({ id, ...data })) };
    }
}

async function apiAddPartyType(data) {
    const payload = { ...data, createdAt: new Date().toISOString() };
    if (USE_FIREBASE) {
        const ref = await db.ref('partyTypes').push(payload);
        return { success: true, id: ref.key };
    } else {
        const id = generateId();
        localData.partyTypes[id] = payload;
        return { success: true, id };
    }
}

async function apiUpdatePartyType(id, data) {
    if (USE_FIREBASE) {
        await db.ref(`partyTypes/${id}`).update(data);
        return { success: true };
    } else {
        localData.partyTypes[id] = { ...localData.partyTypes[id], ...data };
        return { success: true };
    }
}

async function apiDeletePartyType(id) {
    if (USE_FIREBASE) {
        await db.ref(`partyTypes/${id}`).remove();
        return { success: true };
    } else {
        delete localData.partyTypes[id];
        return { success: true };
    }
}

async function apiGetCategories() {
    if (USE_FIREBASE) {
        const snap = await db.ref('categories').once('value');
        const val = snap.val() || {};
        return { success: true, data: Object.entries(val).map(([id, data]) => ({ id, ...data })) };
    } else {

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// --- Custom Hooks ---
function useFetch(fetchFn, dependencies = []) {
    const [state, setState] = useState({ loading: true, data: null, error: null });
    const isMounted = useRef(true);
    
    useEffect(() => {
        isMounted.current = true;
        setState(prev => ({ ...prev, loading: true }));
        fetchFn()
            .then(res => { if (isMounted.current) setState({ loading: false, data: res, error: null }); })
            .catch(err => { if (isMounted.current) setState({ loading: false, data: null, error: err }); });
        return () => { isMounted.current = false; };
    }, dependencies);
    
    return state;
}

function TopLoadingBar() {
    return <div className="top-load"><div className="top-load-bar"></div></div>;
}

// --- Searchable Dropdown Component ---
function SearchableDropdown({ options, value, onChange, placeholder = 'Select...', name, required }) {
    const [isOpen, setIsOpen] = useState(false);
    const [search, setSearch] = useState('');
    const dropdownRef = useRef(null);

    const selectedOption = options.find(o => String(o.value) === String(value));
    const selectedLabel = selectedOption ? selectedOption.label : '';

    const filteredOptions = useMemo(() => {
        if (!search) return options;
        const q = search.toLowerCase();
        return options.filter(o => o.label.toLowerCase().includes(q));
    }, [options, search]);

    useEffect(() => {
        const handleClickOutside = (e) => {
            if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
                setIsOpen(false);
                setSearch('');
            }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
    }, []);

    return (
        <div className="searchable-dropdown" ref={dropdownRef}>
            {name && <input type="hidden" name={name} value={value || ''} />}
            <input 
                type="text" 
                className="searchable-dropdown-input" 
                placeholder={placeholder}
                value={isOpen ? search : selectedLabel}
                onChange={(e) => { setSearch(e.target.value); if (!isOpen) setIsOpen(true); }}
                onClick={() => { setIsOpen(!isOpen); if (!isOpen) setSearch(''); }}
                required={required && !value}
            />
            <span className={`searchable-dropdown-arrow ${isOpen ? 'open' : ''}`}>
                <i className="fas fa-chevron-down"></i>
            </span>
            {isOpen && (
                <div className="searchable-dropdown-list">
                    <div className={`searchable-dropdown-item ${!value ? 'selected' : ''}`} onClick={() => { onChange(''); setIsOpen(false); setSearch(''); }}>
                        {placeholder}
                    </div>
                    {filteredOptions.length > 0 ? (
                        filteredOptions.map((opt, i) => (
                            <div key={i} className={`searchable-dropdown-item ${String(value) === String(opt.value) ? 'selected' : ''}`} 
                                 onClick={() => { onChange(opt.value); setIsOpen(false); setSearch(''); }}>
                                {opt.label}
                            </div>
                        ))
                    ) : (
                        <div className="searchable-dropdown-item no-results">No results found</div>
                    )}
                </div>
            )}
        </div>
    );
}

// --- Dashboard View ---
function DashboardView({ parties, transactions, setMenu }) {
    // Computations
    // From business perspective:
    // Balance = Opening Balance + Sum(Gave) - Sum(Got)
    // If Balance > 0 => Receivable (You will get)
    // If Balance < 0 => Payable (You will give)
    
    const [receivables, setReceivables] = useState(0);
    const [payables, setPayables] = useState(0);
    const [cashBalance, setCashBalance] = useState(0);
    const [bankBalance, setBankBalance] = useState(0);

    useEffect(() => {
        let totalRec = 0;
        let totalPay = 0;
        let cBal = 0;
        let bBal = 0;

        // Calculate balances per party
        parties.forEach(party => {
            let bal = Number(party.openingBalance || 0);
            const partyTx = transactions.filter(t => t.partyId === party.id);
            partyTx.forEach(tx => {
                if (tx.type === 'gave') bal += Number(tx.amount);
                if (tx.type === 'got') bal -= Number(tx.amount);
            });
            if (bal > 0) totalRec += bal;
            if (bal < 0) totalPay += Math.abs(bal);
        });

        // Calculate Cash/Bank balances
        transactions.forEach(tx => {
            const amt = Number(tx.amount);
            if (tx.mode === 'Cash') {
                if (tx.type === 'got') cBal += amt;
                if (tx.type === 'gave') cBal -= amt;
            } else if (tx.mode === 'Bank' || tx.mode === 'UPI') {
                if (tx.type === 'got') bBal += amt;
                if (tx.type === 'gave') bBal -= amt;
            }
        });

        setReceivables(totalRec);
        setPayables(totalPay);
        setCashBalance(cBal);
        setBankBalance(bBal);
    }, [parties, transactions]);

    const recentTx = [...transactions].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5);

    return (
        <div>
            <div className="section-header"><h2><i className="fas fa-chart-pie"></i> Dashboard</h2></div>
            <div className="kpi-grid">
                <div className="small-box bg-success">
                    <div className="inner">
                        <h3>{formatMoney(receivables)}</h3>
                        <p>Total Receivables (To Get)</p>
                    </div>
                    <div className="icon"><i className="fas fa-hand-holding-dollar"></i></div>
                </div>
                <div className="small-box bg-danger">
                    <div className="inner">
                        <h3>{formatMoney(payables)}</h3>
                        <p>Total Payables (To Give)</p>
                    </div>
                    <div className="icon"><i className="fas fa-file-invoice-dollar"></i></div>
                </div>
                <div className="small-box bg-info">
                    <div className="inner">
                        <h3>{formatMoney(cashBalance)}</h3>
                        <p>Cash In Hand</p>
                    </div>
                    <div className="icon"><i className="fas fa-wallet"></i></div>
                </div>
                <div className="small-box bg-navy">
                    <div className="inner">
                        <h3>{formatMoney(bankBalance)}</h3>
                        <p>Bank / UPI Balance</p>
                    </div>
                    <div className="icon"><i className="fas fa-building-columns"></i></div>
                </div>
            </div>
            
            <div className="data-section">
                <h3 style={{marginBottom: '15px', fontSize: '18px', color: 'var(--navy-primary)'}}>Recent Transactions</h3>
                <table className="dataTable">
                    <thead>
                        <tr><th>Date</th><th>Party</th><th>Type</th><th>Amount</th><th>Mode</th></tr>
                    </thead>
                    <tbody>
                        {recentTx.length === 0 ? <tr><td colSpan="5" style={{textAlign:'center', color:'#999'}}>No transactions yet.</td></tr> : null}
                        {recentTx.map(tx => {
                            const party = parties.find(p => p.id === tx.partyId);
                            return (
                                <tr key={tx.id}>
                                    <td>{formatDate(tx.date)}</td>
                                    <td>{party ? party.name : 'Unknown'}</td>
                                    <td><span className={`badge ${tx.type === 'got' ? 'badge-green' : 'badge-red'}`}>{tx.type === 'got' ? 'You Got' : 'You Gave'}</span></td>
                                    <td className={tx.type === 'got' ? 'money-green' : 'money-red'}>{formatMoney(tx.amount)}</td>
                                    <td>{tx.mode}</td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
                <div style={{marginTop: '15px', textAlign: 'center'}}>
                    <button className="btn btn-secondary" onClick={() => setMenu('ledger')}>View All Transactions</button>
                </div>
            </div>
        </div>
    );
}

// --- Party Statement Modal (Ledger view per party) ---
function PartyStatementModal({ party, transactions, onClose }) {
    const [startDate, setStartDate] = useState('');
    const [endDate, setEndDate] = useState('');

    const { calculatedOpeningBalance, txsToDisplay, totalGave, totalGot } = useMemo(() => {
        let opBal = Number(party.openingBalance || 0);
        let displayTxs = [];
        let gave = 0;
        let got = 0;

        // Sort transactions chronologically
        const sorted = [...transactions].sort((a,b) => new Date(a.date) - new Date(b.date));

        sorted.forEach(tx => {
            const txDate = tx.date.slice(0, 10);
            const amt = Number(tx.amount);
            
            if (startDate && txDate < startDate) {
                if (tx.type === 'gave') opBal += amt;
                if (tx.type === 'got') opBal -= amt;
            } else if (endDate && txDate > endDate) {
                // skipped
            } else {
                displayTxs.push(tx);
                if (tx.type === 'gave') gave += amt;
                if (tx.type === 'got') got += amt;
            }
        });

        return { calculatedOpeningBalance: opBal, txsToDisplay: displayTxs, totalGave: gave, totalGot: got };
    }, [transactions, party.openingBalance, startDate, endDate]);

    const formatBalanceDisplay = (bal) => {
        if (!bal) return '₹0.00';
        const absBal = formatMoney(Math.abs(bal));
        return bal > 0 ? `+ ${absBal} (Dr)` : `- ${absBal} (Cr)`;
    };

    const formatRowBalance = (bal) => {
        if (!bal) return '₹0.00';
        const absBal = formatMoney(Math.abs(bal));
        if (bal > 0) return <span className="money-green">+ {absBal}</span>;
        return <span className="money-red">- {absBal}</span>;
    };

    let runningBalance = calculatedOpeningBalance;

    return (
        <div className="modal-overlay" onClick={onClose}>
            <style>{`
                @media print {
                    body * { visibility: hidden; }
                    .modal-lg, .modal-lg * { visibility: visible; }
                    .modal-lg { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; background: white; }
                    .no-print { display: none !important; }
                }
            `}</style>
            <div className="modal modal-lg" onClick={e => e.stopPropagation()}>
                <div className="modal-header no-print">
                    <h3><i className="fas fa-file-invoice"></i> Account Statement - {party.name}</h3>
                    <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
                </div>
                <div className="modal-body">
                    
                    <div className="statement-header">
                        <div>
                            <h4>{party.name}</h4>
                            <span className="badge badge-gray">{party.type}</span> | {party.phone}
                        </div>
                        <div style={{textAlign:'right'}}>
                            <div style={{fontSize:'12px', color:'#777', textTransform:'uppercase'}}>Net Balance</div>
                            <div className={`bal ${party.netBalance > 0 ? 'money-green' : party.netBalance < 0 ? 'money-red' : ''}`}>
                                {formatBalanceDisplay(party.netBalance)}
                            </div>
                        </div>
                    </div>

                    <div className="no-print" style={{ display: 'flex', gap: '15px', marginBottom: '15px', background: '#f8f9fa', padding: '15px', borderRadius: '6px', border: '1px solid #dee2e6', alignItems: 'center' }}>
                        <div style={{flex: 1}}>
                            <label style={{display:'block', fontSize:'12px', color:'#555', marginBottom:'4px', fontWeight:'bold'}}>From Date</label>
                            <input type="date" style={{width:'100%', padding:'8px', borderRadius:'4px', border:'1px solid #ccc'}} value={startDate} onChange={e => setStartDate(e.target.value)} />
                        </div>
                        <div style={{flex: 1}}>
                            <label style={{display:'block', fontSize:'12px', color:'#555', marginBottom:'4px', fontWeight:'bold'}}>To Date</label>
                            <input type="date" style={{width:'100%', padding:'8px', borderRadius:'4px', border:'1px solid #ccc'}} value={endDate} onChange={e => setEndDate(e.target.value)} />
                        </div>
                        <div style={{paddingTop: '20px'}}>
                            <button type="button" className="btn btn-secondary" onClick={() => {setStartDate(''); setEndDate('');}}><i className="fas fa-times-circle"></i> Clear</button>
                        </div>
                    </div>

                    <table className="dataTable" style={{marginTop:0}}>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Particulars (Notes)</th>
                                <th style={{textAlign:'right'}}>You Gave (Dr)</th>
                                <th style={{textAlign:'right'}}>You Got (Cr)</th>
                                <th style={{textAlign:'right'}}>Balance</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr style={{background:'#fcfcfc'}}>
                                <td>{startDate ? formatDate(startDate) : '-'}</td>
                                <td><em>Opening Balance {startDate ? '(As of Date)' : ''}</em></td>
                                <td>-</td>
                                <td>-</td>
                                <td style={{textAlign:'right', fontWeight:700}}>{formatRowBalance(calculatedOpeningBalance)}</td>
                            </tr>
                            {txsToDisplay.length === 0 ? <tr><td colSpan="5" style={{textAlign:'center'}}>No transactions found.</td></tr> : null}
                            {txsToDisplay.map(tx => {
                                const amt = Number(tx.amount);
                                if (tx.type === 'gave') runningBalance += amt;
                                else if (tx.type === 'got') runningBalance -= amt;
                                
                                return (
                                    <tr key={tx.id}>
                                        <td>{formatDate(tx.date)}</td>
                                        <td>
                                            {tx.notes || '-'}
                                            <div style={{fontSize:'12px', color:'#888'}}><i className="fas fa-wallet"></i> {tx.mode}</div>
                                        </td>
                                        <td style={{textAlign:'right'}} className="money-red">{tx.type === 'gave' ? formatMoney(amt) : '-'}</td>
                                        <td style={{textAlign:'right'}} className="money-green">{tx.type === 'got' ? formatMoney(amt) : '-'}</td>
                                        <td style={{textAlign:'right', fontWeight:600}}>{formatRowBalance(runningBalance)}</td>
                                    </tr>
                                );
                            })}
                        </tbody>
                        <tfoot>
                            <tr style={{background:'#f8f9fa'}}>
                                <td colSpan="2" style={{textAlign:'right', fontWeight:700}}>Total Filtered:</td>
                                <td style={{textAlign:'right', fontWeight:700}} className="money-red">{formatMoney(totalGave)}</td>
                                <td style={{textAlign:'right', fontWeight:700}} className="money-green">{formatMoney(totalGot)}</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>

                    <div className="form-actions no-print">
                        <button className="btn btn-secondary" onClick={() => window.print()}><i className="fas fa-print"></i> Print</button>
                        <button className="btn btn-primary" onClick={onClose}>Close</button>
                    </div>
                </div>
            </div>
        </div>
    );
}

// --- Ledger / Transactions View ---
function TransactionsView({ parties, transactions, categories, partyTypes, refresh, user }) {
    const [showModal, setShowModal] = useState(false);
    const [loading, setLoading] = useState(false);
    const tableRef = useRef(null);
    const [txType, setTxType] = useState('gave'); // 'gave' or 'got'
    const [formPartyId, setFormPartyId] = useState('');
    const [formCategoryId, setFormCategoryId] = useState('');
    const [showQuickAdd, setShowQuickAdd] = useState(false);
    const [payments, setPayments] = useState([{ mode: '', amount: '' }]);

    const partyOptions = useMemo(() => parties.map(p => ({ value: p.id, label: `${p.name} (${p.type})` })), [parties]);
    const categoryOptions = useMemo(() => categories.map(c => ({ value: c.id, label: c.name })), [categories]);

    const tableData = useMemo(() => {
        return transactions.map(t => {
            const party = parties.find(p => p.id === t.partyId);
            const category = categories.find(c => c.id === t.categoryId);
            return {
                ...t,
                partyName: party ? party.name : 'Unknown',
                categoryName: category ? category.name : 'Default'
            };
        });
    }, [transactions, parties, categories]);

    useEffect(() => {
        let table = tableRef.current;
        if (table) {
            table.clear().rows.add(tableData).draw(false);
        } else {
            table = $('#txTable').DataTable({
                data: tableData,
                order: [[0, 'desc']], // sort by date desc
                columns: [
                    { data: 'date', title: 'Date', render: d => formatDate(d) },
                    { data: 'partyName', title: 'Party', render: d => `<strong>${escapeHtml(d)}</strong>` },
                    { data: 'type', title: 'Transaction Type', render: d => {
                        return d === 'got' ? '<span class="badge badge-green"><i class="fas fa-arrow-down"></i> You Got</span>' : 
                                             '<span class="badge badge-red"><i class="fas fa-arrow-up"></i> You Gave</span>';
                    }},
                    { data: 'categoryName', title: 'Category', render: d => `<span class="badge badge-gray">${escapeHtml(d)}</span>` },
                    { data: 'amount', title: 'Amount', render: (d, t, row) => {
                        return `<span class="${row.type === 'got' ? 'money-green' : 'money-red'}">${formatMoney(d)}</span>`;
                    }},
                    { data: 'mode', title: 'Payment Mode', render: d => `<span class="badge badge-blue">${escapeHtml(d)}</span>` },
                    { data: 'notes', title: 'Notes' },
                    { data: null, title: 'Action', orderable: false, render: () => 
                        user.role === 'Admin' ? `<button class="action-icon delete-icon" data-action="delete" title="Delete Entry"><i class="fas fa-trash"></i></button>` : `<span style="color:#999;font-size:12px;font-weight:600;">No Access</span>`
                    }
                ],
                responsive: true,
                dom: 'Bfrtip',
                buttons: ['csv', 'print'],
                pageLength: 15
            });
            tableRef.current = table;
        }

        $('#txTable').off('click', '.action-icon').on('click', '.action-icon', function() {
            const data = table.row($(this).parents('tr')).data();
            if ($(this).data('action') === 'delete') handleDelete(data.id);
        });
    }, [tableData]);

    const handleSave = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        
        if (!formPartyId) {
            return Swal.fire({icon: 'warning', title: 'Select a Party'});
        }

        const validPayments = payments.filter(p => Number(p.amount) > 0);
        if (validPayments.length === 0) {
            return Swal.fire({icon: 'warning', title: 'Invalid Amount', text: 'Enter at least one amount greater than 0.'});
        }
        
        setLoading(true);
        for (const p of validPayments) {
            const payload = {
                partyId: formPartyId,
                categoryId: formCategoryId,
                type: txType,
                amount: Number(p.amount),
                mode: p.mode,
                date: fd.get('date'),
                notes: fd.get('notes')
            };
            await apiAddTransaction(payload);
        }
        setLoading(false);
        setShowModal(false);
        refresh();
        Swal.fire({icon:'success', title:'Entry Added', timer: 1500, showConfirmButton: false});
    };

    const handleQuickAddSave = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = {
            name: fd.get('name'),
            type: fd.get('type'),
            phone: fd.get('phone'),
            openingBalance: Number(fd.get('openingBalance')) || 0
        };
        setLoading(true);
        const res = await apiAddParty(payload);
        setLoading(false);
        if (res.success) {
            refresh();
            setFormPartyId(res.id);
            setShowQuickAdd(false);
            Swal.fire({icon:'success', title:'Party Added', timer: 1000, showConfirmButton: false});
        }
    };

    const addPayment = () => setPayments([...payments, { mode: '', amount: '' }]);
    const removePayment = (index) => setPayments(payments.filter((_, i) => i !== index));
    const updatePayment = (index, field, value) => {
        const newPayments = [...payments];
        newPayments[index][field] = value;
        setPayments(newPayments);
    };

    const handleDelete = (id) => {
        Swal.fire({
            title: 'Delete Ledger Entry?',
            text: "This will permanently alter the party's balance.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ea4335',
            confirmButtonText: 'Yes, Delete'
        }).then(async (res) => {
            if (res.isConfirmed) {
                await apiDeleteTransaction(id);
                refresh();
                Swal.fire('Deleted!', '', 'success');
            }
        });
    };

    return (
        <div className="data-section">
            <div className="section-header">
                <h2><i className="fas fa-book"></i> General Ledger</h2>
                <button className="btn btn-primary" onClick={() => { setTxType('gave'); setFormPartyId(''); setFormCategoryId(''); setPayments([{mode: '', amount: ''}]); setShowModal(true); }}>
                    <i className="fas fa-plus"></i> Add Entry
                </button>
            </div>
            
            <table id="txTable" className="display" style={{width:'100%'}}></table>

            {/* Add Transaction Modal */}
            {showModal && (
                <div className="modal-overlay" onClick={() => setShowModal(false)}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">
                            <h3><i className="fas fa-exchange-alt"></i> Add Ledger Entry</h3>
                            <button className="close-btn" onClick={() => setShowModal(false)}><i className="fas fa-times"></i></button>
                        </div>
                        <div className="modal-body">
                            <form onSubmit={handleSave}>
                                
                                <div className="radio-toggle">
                                    <input type="radio" id="typeGave" name="txTypeRadio" checked={txType === 'gave'} onChange={() => setTxType('gave')} />
                                    <label htmlFor="typeGave" className="gave-btn"><i className="fas fa-arrow-up"></i> You Gave (Debit)</label>
                                    
                                    <input type="radio" id="typeGot" name="txTypeRadio" checked={txType === 'got'} onChange={() => setTxType('got')} />
                                    <label htmlFor="typeGot" className="got-btn"><i className="fas fa-arrow-down"></i> You Got (Credit)</label>
                                </div>

                                <div className="form-group">
                                    <label>Select Party *</label>
                                    <div style={{display: 'flex', gap: '10px'}}>
                                        <div style={{flex: 1}}>
                                            <SearchableDropdown 
                                                name="partyId" 
                                                options={partyOptions} 
                                                value={formPartyId} 
                                                onChange={setFormPartyId} 
                                                placeholder="-- Search & Select Party --" 
                                                required={true} 
                                            />
                                        </div>
                                        <button type="button" className="btn btn-success" onClick={() => setShowQuickAdd(true)} style={{padding: '0 15px', height: '46px'}} title="Quick Add Party">
                                            <i className="fas fa-plus"></i> New
                                        </button>
                                    </div>
                                </div>

                                <div className="form-group">
                                    <label>Category</label>
                                    <SearchableDropdown 
                                        name="categoryId" 
                                        options={categoryOptions} 
                                        value={formCategoryId} 
                                        onChange={setFormCategoryId} 
                                        placeholder="-- Select Category --" 
                                    />
                                </div>

                                <div className="form-group" style={{background: '#f8f9fa', padding: '15px', borderRadius: '6px', border: '1px solid #dee2e6'}}>
                                    <label style={{marginBottom: '10px'}}>Payment Details *</label>
                                    {payments.map((p, index) => (
                                        <div key={index} style={{display: 'flex', gap: '10px', marginBottom: '10px', alignItems: 'center'}}>
                                            <input type="number" step="0.01" min="1" placeholder="Amount" value={p.amount} onChange={e => updatePayment(index, 'amount', e.target.value)} style={{flex: 1, padding: '12px 16px', border: '2px solid #e0e0e0', borderRadius: '6px', fontSize: '15px'}} required />
                                            <select value={p.mode} onChange={e => updatePayment(index, 'mode', e.target.value)} style={{flex: 1, padding: '12px 16px', border: '2px solid #e0e0e0', borderRadius: '6px', fontSize: '15px'}} required>
                                                <option value="" disabled>-- Select Mode --</option>
                                                <option value="Cash">Cash</option>
                                                <option value="Bank">Bank Transfer</option>
                                                <option value="UPI">UPI</option>
                                                <option value="Cheque">Cheque</option>
                                                <option value="Adjustment">Adjustment</option>
                                            </select>
                                            {payments.length > 1 && (
                                                <button type="button" className="btn btn-danger" style={{padding: '12px 16px'}} onClick={() => removePayment(index)}><i className="fas fa-trash"></i></button>
                                            )}
                                        </div>
                                    ))}
                                    <button type="button" className="btn btn-secondary btn-sm" onClick={addPayment} style={{marginTop: '5px', padding: '8px 12px', fontSize: '12px'}}>
                                        <i className="fas fa-plus"></i> Add Split Payment
                                    </button>
                                    <div style={{marginTop: '10px', textAlign: 'right', fontWeight: 700, color: 'var(--navy-primary)', fontSize: '16px'}}>
                                        Total: {formatMoney(payments.reduce((sum, p) => sum + Number(p.amount || 0), 0))}
                                    </div>
                                </div>

                                <div className="form-grid">
                                    <div className="form-group">
                                        <label>Date *</label>
                                        <input type="date" name="date" defaultValue={new Date().toISOString().slice(0, 10)} required />
                                    </div>
                                    <div className="form-group">
                                        <label>Notes / Particulars</label>
                                        <input type="text" name="notes" placeholder="Reason for transaction..." />
                                    </div>
                                </div>

                                <div className="form-actions">
                                    <button type="submit" className={`btn ${txType === 'got' ? 'btn-success' : 'btn-danger'}`} disabled={loading}>
                                        {loading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-save"></i>} Save Entry
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            )}

            {/* Quick Add Party Modal */}
            {showQuickAdd && (
                <div className="modal-overlay" style={{zIndex: 1050}} onClick={() => setShowQuickAdd(false)}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">
                            <h3><i className="fas fa-user-plus"></i> Quick Add Party</h3>
                            <button className="close-btn" onClick={() => setShowQuickAdd(false)}><i className="fas fa-times"></i></button>
                        </div>
                        <div className="modal-body">
                            <form onSubmit={handleQuickAddSave}>
                                <div className="form-group">
                                    <label>Party Name *</label>
                                    <input type="text" name="name" required />
                                </div>
                                <div className="form-grid">
                                    <div className="form-group">
                                        <label>Party Type *</label>
                                        <select name="type">
                                            {partyTypes.map(pt => (
                                                <option key={pt.id} value={pt.name}>{pt.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="form-group">
                                        <label>Phone Number</label>
                                        <input type="text" name="phone" />
                                    </div>
                                </div>
                                <div className="form-group">
                                    <label>Opening Balance</label>
                                    <input type="number" step="0.01" name="openingBalance" defaultValue="0" />
                                    <small style={{color:'#888', marginTop:'4px', display:'block'}}>Positive: You Get | Negative: You Give</small>
                                </div>
                                <div className="form-actions">
                                    <button type="submit" className="btn btn-success" disabled={loading}>
                                        {loading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-save"></i>} Add Party
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

            {showModal && (
                <div className="modal-overlay" onClick={() => setShowModal(false)}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">
                            <h3><i className="fas fa-layer-group"></i> {editData ? 'Edit Type' : 'Add Type'}</h3>
                            <button className="close-btn" onClick={() => setShowModal(false)}><i className="fas fa-times"></i></button>
                        </div>
                        <div className="modal-body">
                            <form onSubmit={handleSave}>
                                <div className="form-group">
                                    <label>Party Type Name *</label>
                                    <input type="text" name="name" defaultValue={editData?.name} required />
                                </div>
                                <div className="form-actions">
                                    <button type="submit" className="btn btn-success" disabled={loading}>
                                        {loading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-save"></i>} Save
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

                        <button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>
                        ` : `<span style="color:#999;font-size:12px;font-weight:600;">No Access</span>`
                    }
                ],
                responsive: true,
                dom: 'Bfrtip',
                buttons: ['csv', 'print'],
                pageLength: 10
            });
            tableRef.current = table;
        }

        $('#categoriesTable').off('click', '.action-icon').on('click', '.action-icon', function() {
            const data = table.row($(this).parents('tr')).data();
            const action = $(this).data('action');
            if (action === 'edit') {
                setEditData(data);
                setShowModal(true);
            } else if (action === 'delete') {
                handleDelete(data.id, data.name);
            }
        });
    }, [categories]);

    const handleSave = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = { name: fd.get('name') };
        
        setLoading(true);
        if (editData) await apiUpdateCategory(editData.id, payload);
        else await apiAddCategory(payload);
        
        setLoading(false);
        setShowModal(false);
        setEditData(null);
        refresh();
        Swal.fire({icon:'success', title:'Saved', timer: 1500, showConfirmButton: false});

        Swal.fire({

            confirmButtonColor: '#ea4335',

            if (res.isConfirmed) {
                await apiDeleteCategory(id);
                refresh();
                Swal.fire('Deleted!', '', 'success');
            }
        });
    };

    return (
        <div className="data-section">
            <div className="section-header">
                <h2><i className="fas fa-tags"></i> Categories</h2>
                <button className="btn btn-primary" onClick={() => { setEditData(null); setShowModal(true); }}>
                    <i className="fas fa-plus"></i> Add Category
                </button>
            </div>
            
            <table id="categoriesTable" className="display" style={{width:'100%'}}></table>

            {showModal && (
                <div className="modal-overlay" onClick={() => setShowModal(false)}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">
                            <h3><i className="fas fa-tag"></i> {editData ? 'Edit Category' : 'Add Category'}</h3>
                            <button className="close-btn" onClick={() => setShowModal(false)}><i className="fas fa-times"></i></button>
                        </div>
                        <div className="modal-body">
                            <form onSubmit={handleSave}>
                                <div className="form-group">
                                    <label>Category Name *</label>
                                    <input type="text" name="name" defaultValue={editData?.name} required />
                                </div>
                                <div className="form-actions">
                                    <button type="submit" className="btn btn-success" disabled={loading}>
                                        {loading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-save"></i>} Save
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

// --- Reports (Register) View ---
function ReportsView({ parties, transactions, categories }) {
    const [startDate, setStartDate] = useState(() => {
        const d = new Date(); d.setDate(1); return d.toISOString().slice(0, 10);
    });
    const [endDate, setEndDate] = useState(() => new Date().toISOString().slice(0, 10));
    const [modeFilter, setModeFilter] = useState('All');
    const tableRef = useRef(null);

    const filteredTx = useMemo(() => {
        let filtered = transactions;
        if (startDate) filtered = filtered.filter(t => t.date.slice(0, 10) >= startDate);
        if (endDate) filtered = filtered.filter(t => t.date.slice(0, 10) <= endDate);
        if (modeFilter !== 'All') filtered = filtered.filter(t => t.mode === modeFilter);
        
        return filtered.map(t => {
            const party = parties.find(p => p.id === t.partyId);
            const category = categories.find(c => c.id === t.categoryId);
            return {
                ...t,
                partyName: party ? party.name : 'Unknown',
                categoryName: category ? category.name : 'Default'
            };
        });
    }, [transactions, parties, categories, startDate, endDate, modeFilter]);

    const summary = useMemo(() => {
        let totalGot = 0;
        let totalGave = 0;
        filteredTx.forEach(t => {
            if (t.type === 'got') totalGot += Number(t.amount);
            if (t.type === 'gave') totalGave += Number(t.amount);
        });
        return { totalGot, totalGave, net: totalGot - totalGave };
    }, [filteredTx]);

    useEffect(() => {
        let table = tableRef.current;
        if (table) {
            table.clear().rows.add(filteredTx).draw(false);
        } else {
            table = $('#reportsTable').DataTable({
                data: filteredTx,
                order: [[0, 'desc']],
                columns: [
                    { data: 'date', title: 'Date', render: d => formatDate(d) },
                    { data: 'partyName', title: 'Party', render: d => `<strong>${escapeHtml(d)}</strong>` },
                    { data: 'categoryName', title: 'Category', render: d => `<span class="badge badge-gray">${escapeHtml(d)}</span>` },
                    { data: 'mode', title: 'Mode' },
                    { data: 'type', title: 'Type', render: d => d === 'got' ? '<span class="badge badge-green">In (Got)</span>' : '<span class="badge badge-red">Out (Gave)</span>' },
                    { data: 'amount', title: 'Amount', render: (d, t, row) => `<span class="${row.type === 'got' ? 'money-green' : 'money-red'}">${formatMoney(d)}</span>` },
                ],
                responsive: true,
                dom: 'Bfrtip',
                buttons: ['csv', 'print'],
                pageLength: 20
            });
            tableRef.current = table;
        }
    }, [filteredTx]);

    return (
        <div>
            <div className="section-header"><h2><i className="fas fa-file-invoice"></i> Ledger Reports & Register</h2></div>
            
            <div className="data-section" style={{marginBottom: '20px'}}>
                <div className="form-grid" style={{alignItems: 'end'}}>
                    <div className="form-group" style={{marginBottom: 0}}>
                        <label>From Date</label>
                        <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} />
                    </div>
                    <div className="form-group" style={{marginBottom: 0}}>
                        <label>To Date</label>
                        <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} />
                    </div>
                    <div className="form-group" style={{marginBottom: 0}}>
                        <label>Payment Mode</label>
                        <select value={modeFilter} onChange={e => setModeFilter(e.target.value)}>
                            <option value="All">All Modes</option>
                            <option value="Cash">Cash</option>
                            <option value="Bank">Bank Transfer (NEFT/RTGS/IMPS)</option>
                            <option value="UPI">UPI (GPay, PhonePe, Paytm)</option>
                            <option value="Cheque">Cheque</option>
                            <option value="Adjustment">Adjustment / Discount</option>
                        </select>
                    </div>
                </div>
            </div>

            <div className="kpi-grid">
                <div className="small-box bg-success">
                    <div className="inner">
                        <h3>{formatMoney(summary.totalGot)}</h3>
                        <p>Total Cash In (Got)</p>
                    </div>
                    <div className="icon"><i className="fas fa-arrow-down"></i></div>
                </div>
                <div className="small-box bg-danger">
                    <div className="inner">
                        <h3>{formatMoney(summary.totalGave)}</h3>
                        <p>Total Cash Out (Gave)</p>
                    </div>
                    <div className="icon"><i className="fas fa-arrow-up"></i></div>
                </div>
                <div className="small-box bg-navy">
                    <div className="inner">
                        <h3>{formatMoney(summary.net)}</h3>
                        <p>Net Balance Filtered</p>
                    </div>
                    <div className="icon"><i className="fas fa-scale-balanced"></i></div>
                </div>
            </div>

            <div className="data-section">
                <table id="reportsTable" className="display" style={{width:'100%'}}></table>
            </div>
        </div>
    );
}

// --- Users View ---
function UsersView({ currentUser }) {
    const [users, setUsers] = useState([]);
    const [loading, setLoading] = useState(true);
    const [showModal, setShowModal] = useState(false);
    const [editData, setEditData] = useState(null);
    const tableRef = useRef(null);

    const loadUsers = async () => {
        setLoading(true);
        const res = await apiGetUsers();
        if(res.success) setUsers(res.data);
        setLoading(false);
    };

    useEffect(() => { loadUsers(); }, []);

    useEffect(() => {
        let table = tableRef.current;
        if (table) {
            table.clear().rows.add(users).draw(false);
        } else {
            table = $('#usersTable').DataTable({
                data: users,
                columns: [
                    { data: 'name', title: 'Name', render: d => `<strong>${escapeHtml(d)}</strong>` },
                    { data: 'email', title: 'Email' },
                    { data: 'role', title: 'Role', render: d => `<span class="badge ${d==='Admin'?'badge-blue':'badge-gray'}">${d}</span>` },
                    { data: null, title: 'Actions', orderable: false, render: (data) => {
                        if(data.id === currentUser.id) return `<span class="badge badge-green">You</span>`;
                        return `
                        <button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>
                        <button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>
                        `;
                    }}
                ],
                responsive: true,
                dom: 'Bfrtip',
                buttons: ['csv', 'print'],
                pageLength: 10
            });
            tableRef.current = table;
        }

        $('#usersTable').off('click', '.action-icon').on('click', '.action-icon', function() {
            const data = table.row($(this).parents('tr')).data();
            const action = $(this).data('action');
            if (action === 'edit') {
                setEditData(data);
                setShowModal(true);
            } else if (action === 'delete') {
                handleDelete(data.id, data.name);
            }
        });
    }, [users]);

    const handleSave = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = { 
            name: fd.get('name'),
            email: fd.get('email'),
            role: fd.get('role')
        };
        const pwd = fd.get('password');
        if(pwd) payload.password = pwd;
        else if(!editData) return Swal.fire({icon:'warning', title:'Password required'});
        
        setLoading(true);
        let res;
        if (editData) res = await apiUpdateUser(editData.id, payload);
        else res = await apiAddUser(payload);
        
        if(!res.success) {
            setLoading(false);
            return Swal.fire({icon:'error', title:'Error', text: res.message});
        }
        
        setShowModal(false);
        setEditData(null);
        loadUsers();
        Swal.fire({icon:'success', title:'Saved', timer: 1500, showConfirmButton: false});
    };

    const handleDelete = (id, name) => {
        Swal.fire({
            title: `Delete ${name}?`,
            text: "This user will lose access to the system.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ea4335',
            confirmButtonText: 'Yes, Delete'
        }).then(async (res) => {
            if (res.isConfirmed) {
                await apiDeleteUser(id);
                loadUsers();
                Swal.fire('Deleted!', '', 'success');
            }
        });
    };

    return (
        <div className="data-section">
            <div className="section-header">
                <h2><i className="fas fa-users-cog"></i> Manage Users</h2>
                <button className="btn btn-primary" onClick={() => { setEditData(null); setShowModal(true); }}>
                    <i className="fas fa-plus"></i> Add User
                </button>
            </div>
            
            <table id="usersTable" className="display" style={{width:'100%'}}></table>

            {showModal && (
                <div className="modal-overlay" onClick={() => setShowModal(false)}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">
                            <h3><i className="fas fa-user"></i> {editData ? 'Edit User' : 'Add User'}</h3>
                            <button className="close-btn" onClick={() => setShowModal(false)}><i className="fas fa-times"></i></button>
                        </div>
                        <div className="modal-body">
                            <form onSubmit={handleSave}>
                                <div className="form-group">
                                    <label>Full Name *</label>
                                    <input type="text" name="name" defaultValue={editData?.name} required />
                                </div>
                                <div className="form-group">
                                    <label>Email Address *</label>
                                    <input type="email" name="email" defaultValue={editData?.email} required />
                                </div>
                                <div className="form-group">
                                    <label>Password {editData ? '(Leave blank to keep same)' : '*'}</label>
                                    <input type="password" name="password" placeholder={editData ? "******" : "Enter password"} />
                                </div>
                                <div className="form-group">
                                    <label>Role *</label>
                                    <select name="role" defaultValue={editData?.role || 'User'} required>
                                        <option value="Admin">Admin (Full Access)</option>
                                        <option value="User">User (Add & View Only)</option>
                                    </select>
                                </div>
                                <div className="form-actions">
                                    <button type="submit" className="btn btn-success" disabled={loading}>
                                        {loading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-save"></i>} Save User
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

// --- Main Dashboard Wrapper ---
function Dashboard({ user, onLogout }) {
    const [activeMenu, setActiveMenu] = useState('dashboard');
    const [sidebarOpen, setSidebarOpen] = useState(false);
    const [reloadKey, setReloadKey] = useState(0);

    const { loading: l1, data: d1 } = useFetch(apiGetParties, [reloadKey]);
    const { loading: l2, data: d2 } = useFetch(apiGetTransactions, [reloadKey]);
    const { loading: l3, data: d3 } = useFetch(apiGetCategories, [reloadKey]);
    const { loading: l4, data: d4 } = useFetch(apiGetPartyTypes, [reloadKey]);

    const parties = useMemo(() => d1?.data || [], [d1]);
    const transactions = useMemo(() => d2?.data || [], [d2]);
    const categories = useMemo(() => d3?.data || [], [d3]);
    const partyTypes = useMemo(() => d4?.data || [], [d4]);
    const loading = l1 || l2 || l3 || l4;

    const triggerRefresh = () => setReloadKey(k => k + 1);
    const toggleSidebar = () => setSidebarOpen(!sidebarOpen);

    const navTitles = {
        'dashboard': 'Financial Dashboard',
        'parties': 'Manage Parties',
        'ledger': 'General Ledger',
        'partyTypes': 'Manage Types',
        'categories': 'Categories',
        'reports': 'Reports & Register',
        'users': 'Manage Users'
    };

    return (
        <div className="app-container">
            {/* Sidebar */}
            <div className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
                <div className="sidebar-brand">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo" className="sidebar-brand-logo" />
                    <span className="sidebar-brand-name">Ledger Pro</span>
                </div>
                <div className="sidebar-user-info">
                    <div className="sidebar-user-name">{user.name}</div>
                    <div className="sidebar-user-role">{user.role}</div>
                </div>
                <div className="sidebar-menu-section">
                    <ul className="sidebar-menu">
                        <li>
                            <button className={activeMenu === 'dashboard' ? 'active' : ''} onClick={() => {setActiveMenu('dashboard'); setSidebarOpen(false)}}>
                                <i className="fas fa-chart-pie"></i><span>Dashboard</span>
                            </button>
                        </li>
                        <li>
                            <button className={activeMenu === 'parties' ? 'active' : ''} onClick={() => {setActiveMenu('parties'); setSidebarOpen(false)}}>
                                <i className="fas fa-users"></i><span>Parties / Contacts</span>
                            </button>
                        </li>
                        <li>
                            <button className={activeMenu === 'ledger' ? 'active' : ''} onClick={() => {setActiveMenu('ledger'); setSidebarOpen(false)}}>
                                <i className="fas fa-book"></i><span>General Ledger</span>
                            </button>
                        </li>
                        <li>
                            <button className={activeMenu === 'partyTypes' ? 'active' : ''} onClick={() => {setActiveMenu('partyTypes'); setSidebarOpen(false)}}>
                                <i className="fas fa-users-rectangle"></i><span>Manage Types</span>
                            </button>
                        </li>
                        <li>
                            <button className={activeMenu === 'categories' ? 'active' : ''} onClick={() => {setActiveMenu('categories'); setSidebarOpen(false)}}>
                                <i className="fas fa-tags"></i><span>Categories</span>
                            </button>
                        </li>
                        <li>
                            <button className={activeMenu === 'reports' ? 'active' : ''} onClick={() => {setActiveMenu('reports'); setSidebarOpen(false)}}>
                                <i className="fas fa-file-invoice"></i><span>Reports & Register</span>
                            </button>
                        </li>
                        {user.role === 'Admin' && (
                            <li>
                                <button className={activeMenu === 'users' ? 'active' : ''} onClick={() => {setActiveMenu('users'); setSidebarOpen(false)}}>
                                    <i className="fas fa-users-cog"></i><span>Manage Users</span>
                                </button>
                            </li>
                        )}
                    </ul>
                </div>
                <div className="sidebar-logout">
                    <button onClick={onLogout}><i className="fas fa-sign-out-alt"></i><span>Logout</span></button>
                </div>
            </div>

            {/* Main Workspace */}
            <div className="main-content" onClick={() => sidebarOpen && setSidebarOpen(false)}>
                {loading && <TopLoadingBar />}
                
                <div className="navbar">
                    <div className="nav-title">
                        <button className="nav-btn d-md-none" onClick={toggleSidebar} style={{marginRight: '15px'}}><i className="fas fa-bars"></i></button>
                        {navTitles[activeMenu]}
                    </div>
                    <div className="nav-actions">
                        <button className="nav-btn" onClick={triggerRefresh} title="Refresh Data"><i className="fas fa-sync-alt"></i></button>
                    </div>
                </div>

                {!loading && (
                    <>
                        {activeMenu === 'dashboard' && <DashboardView parties={parties} transactions={transactions} setMenu={setActiveMenu} />}
                        {activeMenu === 'parties' && <PartiesView parties={parties} transactions={transactions} partyTypes={partyTypes} refresh={triggerRefresh} user={user} />}
                        {activeMenu === 'ledger' && <TransactionsView parties={parties} transactions={transactions} categories={categories} partyTypes={partyTypes} refresh={triggerRefresh} user={user} />}
                        {activeMenu === 'partyTypes' && <PartyTypesView partyTypes={partyTypes} refresh={triggerRefresh} user={user} />}
                        {activeMenu === 'categories' && <CategoriesView categories={categories} refresh={triggerRefresh} user={user} />}
                        {activeMenu === 'reports' && <ReportsView parties={parties} transactions={transactions} categories={categories} />}
                        {activeMenu === 'users' && user.role === 'Admin' && <UsersView currentUser={user} />}
                    </>
                )}
            </div>
        </div>
    );
}

// --- App Bootstrap ---
function App() {
    const [user, setUser] = useState(null);

    useEffect(() => {
        const saved = localStorage.getItem('ledger_user');
        if (saved) {
            try { setUser(JSON.parse(saved)); } catch(e){}
        }
    }, []);

    const handleLogin = (userData) => {
        localStorage.setItem('ledger_user', JSON.stringify(userData));
        setUser(userData);
    };

    const handleLogout = () => {
        localStorage.removeItem('ledger_user');
        setUser(null);
    };

    if (!user) return <LoginPage onLogin={handleLogin} />;
    return <Dashboard user={user} onLogout={handleLogout} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
